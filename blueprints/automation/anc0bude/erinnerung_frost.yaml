blueprint:
  name: Termin nach Frostvorhersage
  description: >-
    Setzt die Fälligkeit einer Erinnerung auf den ersten Frosttag der Wettervorhersage, einmal pro Winter, zum
    Beispiel „Außenwasser abdrehen und entlüften“. Die Grenzwerte (Frost ab, Vorhersage-Fenster, Zurücksetzen im
    Frühjahr) stehen in Hilfsgrößen `input_number`, damit sie in der reminder-card änderbar sind. Optional löst auch
    ein Frostalarm-Sensor (zum Beispiel einer Wetterstation) den Termin aus, wenn die Vorhersage keinen Frost zeigt.
    Zum Frühjahrstermin wird die Erinnerung zurückgesetzt und optional eine zweite Erinnerung („wieder aufdrehen“)
    fällig gestellt.
  domain: automation
  author: anc0bude
  source_url: https://github.com/anc0bude/reminder-card/blob/main/blueprints/automation/anc0bude/erinnerung_frost.yaml
  input:
    wetter:
      name: Wetter-Entität mit Vorhersage
      selector:
        entity:
          domain: weather
    faellig:
      name: Helfer „Fällig am“ der Frost-Erinnerung
      selector:
        entity:
          domain: input_datetime
    gemeldet:
      name: Helfer „Gemeldet“ der Frost-Erinnerung
      selector:
        entity:
          domain: input_datetime
    frost_ab:
      name: Helfer „Frost ab (°C)“
      description: Zahl-Helfer (`input_number`) mit dem Tiefstwert der Vorhersage, bei dem gewarnt wird.
      selector:
        entity:
          domain: input_number
    tage:
      name: Helfer „Vorhersage-Fenster (Tage)“
      selector:
        entity:
          domain: input_number
    reset_monat:
      name: Helfer „Zurücksetzen im Monat“
      selector:
        entity:
          domain: input_number
    faellig_fruehjahr:
      name: Helfer „Fällig am“ für „wieder aufdrehen“ (optional)
      selector:
        entity:
          domain: input_datetime
      default: ""
    frostalarm:
      name: Frostalarm-Sensor (optional)
      description: >-
        Binärsensor, der „an“ meldet, wenn es friert, zum Beispiel der Frostalarm einer Wetterstation. Ist er an und
        zeigt die Vorhersage keinen Frost, wird der Termin auf heute gesetzt. Leer = nur die Vorhersage zählt.
      selector:
        entity:
          domain: binary_sensor
      default: ""

mode: single

variables:
  wetter: !input wetter
  faellig: !input faellig
  gemeldet: !input gemeldet
  h_frost: !input frost_ab
  h_tage: !input tage
  h_reset: !input reset_monat
  fruehjahr: !input faellig_fruehjahr
  alarm: !input frostalarm
  frost_ab: "{{ states(h_frost) | float(-2) }}"
  tage: "{{ states(h_tage) | int(3) }}"
  reset_monat: "{{ states(h_reset) | int(4) }}"
  wintermonate: "{{ (range(10, 13) | list) + (range(1, reset_monat | int(4)) | list) }}"

triggers:
  - trigger: time
    at: "06:00:00"
  - trigger: time
    at: "18:00:00"
  - trigger: template
    value_template: "{{ alarm | string | length > 0 and is_state(alarm, 'on') }}"

actions:
  - choose:
      # Frühjahr: zurücksetzen (am ersten Tag des Reset-Monats)
      - conditions:
          - condition: template
            value_template: "{{ now().month == reset_monat | int(4) and now().day == 1 and now().hour < 12 }}"
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ faellig }}"
            data:
              datetime: "2099-12-31 00:00:00"
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ gemeldet }}"
            data:
              datetime: "1970-01-01 00:00:00"
          - if:
              - condition: template
                value_template: "{{ fruehjahr | string | length > 0 }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "{{ fruehjahr }}"
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d') }} 00:00:00"
      # Winter: erster Frosttag der Vorhersage (oder Frostalarm)
      - conditions:
          - condition: template
            value_template: "{{ now().month in wintermonate }}"
          - condition: template
            value_template: "{{ states(faellig).startswith('2099') }}"
          - condition: template
            value_template: >-
              {% set start_jahr = now().year if now().month >= 10 else now().year - 1 %}
              {{ states(gemeldet) < (start_jahr | string) ~ '-10-01' }}
        sequence:
          - action: weather.get_forecasts
            target:
              entity_id: "{{ wetter }}"
            data:
              type: daily
            response_variable: fc
          - variables:
              tage_liste: "{{ (fc[wetter].forecast | list)[: tage | int(3)] }}"
              frosttag: >-
                {% set ns = namespace(d='') %}
                {% for t in tage_liste %}
                  {% set tief = t.templow if t.templow is defined and t.templow is not none else t.temperature %}
                  {% if ns.d == '' and tief is not none and tief | float(99) <= frost_ab | float(-2) %}
                    {% set ns.d = (t.datetime | string)[:10] %}
                  {% endif %}
                {% endfor %}
                {% if ns.d == '' and alarm | string | length > 0 and is_state(alarm, 'on') %}{{ now().strftime('%Y-%m-%d') }}{% else %}{{ ns.d }}{% endif %}
          - if:
              - condition: template
                value_template: "{{ frosttag != '' }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "{{ faellig }}"
                data:
                  datetime: "{{ frosttag }} 00:00:00"
