blueprint:
  name: Erinnerungen melden
  description: >-
    Meldet fällige Erinnerungen der reminder-card auf Handys und Tablets. Es werden alle Helfer
    `input_datetime.erinnerung_<id>_faellig` geprüft (Datum und Uhrzeit). Erste Meldung `Vorlauf` vor der Fälligkeit
    (Einheit Stunden, Tage oder Monate je Erinnerung), dann am Fälligkeitstermin und danach alle `Wiederholung` Tage
    (0 = nur die erste Meldung). Vorlauf, Einheit und Wiederholung stehen je Erinnerung in
    `input_number.erinnerung_<id>_vorlauf`, `input_select.erinnerung_<id>_vorlauf_einheit` und `_wiederholung`.
    Jede Erinnerung kann eigene Geräte (`input_text.erinnerung_<id>_geraete`) und eine eigene Meldezeit
    (`input_text.erinnerung_<id>_meldezeit`) haben, sonst gelten die Standardwerte dieses Blueprints.
    Der „Erledigt“-Knopf in der Meldung erscheint automatisch nur dort, wo er etwas bewirkt (Intervall, Saison oder
    Wiederholung größer als 0).
    Mit `input_boolean.erinnerung_<id>_aktiv` lässt sich die Meldung einer Erinnerung ausschalten, mit
    `input_boolean.erinnerungen_aktiv` alle Meldungen (fehlt ein Schalter, gilt „an“). Die Fälligkeit wird dabei
    weiter berechnet, nur die Meldung entfällt, und nach dem Wiedereinschalten wird sie nachgeholt.
    Eine Fälligkeit im Jahr 2099 bedeutet „kein Termin“. Die Prüfung läuft jede Minute. Erinnerungen mit Vorlauf in
    Tagen oder Monaten werden erst ab der gewählten Uhrzeit gemeldet, Erinnerungen mit Vorlauf in Stunden sofort.
    Für Müll und andere Erinnerungen mit eigener Uhrzeit: Blueprint ein zweites Mal verwenden und mit
    „nur diese IDs“ beziehungsweise „diese IDs auslassen“ aufteilen.
  domain: automation
  author: anc0bude
  source_url: https://github.com/anc0bude/reminder-card/blob/main/blueprints/automation/anc0bude/erinnerungen_melden.yaml
  input:
    uhrzeit:
      name: Standard-Uhrzeit für Meldungen
      description: >-
        Früheste Uhrzeit für Erinnerungen, deren Vorlauf in Tagen oder Monaten angegeben ist. Jede Erinnerung kann mit
        `input_text.erinnerung_<id>_meldezeit` (Format HH:MM) eine eigene Uhrzeit haben.
      selector:
        time: {}
      default: "08:00:00"
    geraete:
      name: Standard-Geräte
      description: >-
        Namen der Notify-Dienste der Companion-App ohne `notify.`, zum Beispiel `mobile_app_mein_handy`. Diese Geräte
        bekommen die Meldung, wenn bei einer Erinnerung keine eigenen Geräte eingestellt sind
        (`input_text.erinnerung_<id>_geraete`, Namen ohne `mobile_app_`, durch Komma getrennt).
      selector:
        select:
          multiple: true
          custom_value: true
          options: []
      default: []
    erledigt_knopf:
      name: „Erledigt“-Knopf (veraltet, wird ignoriert)
      description: >-
        Wird nicht mehr ausgewertet. Der Knopf erscheint automatisch dort, wo er etwas bewirkt: bei Erinnerungen mit
        Intervall, bei saisonalen Erinnerungen und bei allen anderen, wenn eine Wiederholung eingestellt ist.
      selector:
        boolean: {}
      default: true
    tippen_pfad:
      name: Beim Tippen öffnen (optional)
      description: Pfad im Dashboard, zum Beispiel `/lovelace/erinnerungen`. Leer = nichts öffnen.
      selector:
        text: {}
      default: ""
    ids_einschliessen:
      name: Nur diese IDs
      description: IDs der Erinnerungen, leer = alle.
      selector:
        select:
          multiple: true
          custom_value: true
          options: []
      default: []
    ids_auslassen:
      name: Diese IDs auslassen
      selector:
        select:
          multiple: true
          custom_value: true
          options: []
      default: []

mode: single
max_exceeded: silent

variables:
  devices: !input geraete
  tippen_pfad: !input tippen_pfad
  inc: !input ids_einschliessen
  exc: !input ids_auslassen
  uhr: !input uhrzeit
  due: >-
    {% set ns = namespace(l=[]) %}
    {% set mult = {'Stunden': 1, 'Tage': 24, 'Monate': 730.5} %}
    {% set nowt = as_timestamp(now()) %}
    {% set midnight = as_timestamp(today_at('00:00')) %}
    {% set clock = now().strftime('%H:%M:%S') %}
    {% for s in states.input_datetime if s.entity_id.startswith('input_datetime.erinnerung_') and s.entity_id.endswith('_faellig') %}
      {% set rid = s.entity_id[26:-8] %}
      {% if s.state[:4] | int(0) in range(2000, 2099) and (inc | length == 0 or rid in inc) and rid not in exc and states('input_boolean.erinnerung_' ~ rid ~ '_aktiv') != 'off' %}
        {% set ft = as_timestamp(s.state, 0) %}
        {% set unit = states('input_select.erinnerung_' ~ rid ~ '_vorlauf_einheit') %}
        {% set vl_s = (states('input_number.erinnerung_' ~ rid ~ '_vorlauf') | float(7)) * mult.get(unit, 24) * 3600 %}
        {% set rep = states('input_number.erinnerung_' ~ rid ~ '_wiederholung') | float(0) %}
        {% set gm = as_timestamp(states('input_datetime.erinnerung_' ~ rid ~ '_gemeldet'), 0) %}
        {% set gtxt = states('input_text.erinnerung_' ~ rid ~ '_geraete') %}
        {% set own = (gtxt.split(',') | map('trim') | reject('equalto', '') | map('regex_replace', '^', 'mobile_app_') | list) if gtxt not in ['unknown', 'unavailable', ''] else [] %}
        {% set devs = own if own | length > 0 else devices %}
        {% set mz = states('input_text.erinnerung_' ~ rid ~ '_meldezeit') %}
        {% set mzt = (mz ~ ':00') if (mz | length == 5 and mz[2] == ':') else uhr %}
        {% set has_iv = states('input_number.erinnerung_' ~ rid ~ '_intervall') not in ['unknown', 'unavailable'] %}
        {% set art = states('input_select.erinnerung_' ~ rid ~ '_art') %}
        {% set knopf = has_iv or art == 'Saison' or rep > 0 %}
        {% set start = ft - vl_s %}
        {% set first = gm < start %}
        {% set dueday = rep > 0 and nowt >= ft and gm < ft %}
        {% set repeat = rep > 0 and nowt >= ft and (nowt - gm) >= rep * 86400 %}
        {% set day_ok = unit == 'Stunden' or clock >= mzt %}
        {% if nowt >= start and day_ok and devs | length > 0 and (first or dueday or repeat) %}
          {% set date_only = s.state[11:16] == '00:00' %}
          {% set hrs = (ft - nowt) / 3600 %}
          {% set days = ((ft - midnight) / 86400) | round(0) | int %}
          {% set when = ft | timestamp_custom('%d.%m.%Y' if date_only else '%d.%m.%Y %H:%M') %}
          {% if date_only %}
            {% set msg = 'heute fällig' if days == 0 else ('fällig morgen (' ~ when ~ ')' if days == 1 else ('fällig in ' ~ days ~ ' Tagen (' ~ when ~ ')' if days > 1 else 'seit ' ~ (-days) ~ ' Tagen überfällig (' ~ when ~ ')')) %}
          {% elif (hrs | abs) < 1 %}
            {% set m = (hrs * 60) | abs | round(0) | int %}
            {% set msg = ('fällig in ' ~ m ~ ' Minuten (' ~ when ~ ')') if hrs >= 0 else ('seit ' ~ m ~ ' Minuten überfällig (' ~ when ~ ')') %}
          {% elif (hrs | abs) < 48 %}
            {% set h = hrs | abs | round(0) | int %}
            {% set msg = ('fällig in ' ~ h ~ ' Stunden (' ~ when ~ ')') if hrs >= 0 else ('seit ' ~ h ~ ' Stunden überfällig (' ~ when ~ ')') %}
          {% else %}
            {% set d = (hrs / 24) | abs | round(0) | int %}
            {% set msg = ('fällig in ' ~ d ~ ' Tagen (' ~ when ~ ')') if hrs >= 0 else ('seit ' ~ d ~ ' Tagen überfällig (' ~ when ~ ')') %}
          {% endif %}
          {% set ns.l = ns.l + [{'id': rid, 'name': s.name, 'msg': msg, 'devs': devs, 'knopf': knopf}] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.l | tojson }}

triggers:
  - trigger: time_pattern
    minutes: "/1"

conditions:
  - condition: template
    value_template: >-
      {{ (due | from_json if due is string else due) | length > 0
         and states('input_boolean.erinnerungen_aktiv') != 'off' }}

actions:
  - repeat:
      for_each: "{{ due | from_json if due is string else due }}"
      sequence:
        - variables:
            item: "{{ repeat.item }}"
        - repeat:
            for_each: "{{ item.devs }}"
            sequence:
              - action: "{{ 'notify.' ~ repeat.item }}"
                continue_on_error: true
                data:
                  title: "Erinnerung: {{ item.name }}"
                  message: "{{ item.msg }}"
                  data:
                    tag: "{{ 'erinnerung_' ~ item.id }}"
                    group: erinnerungen
                    actions: "{{ [{'action': 'ERL_' ~ item.id, 'title': 'Erledigt'}] if item.knopf else [] }}"
                    clickAction: "{{ tippen_pfad }}"
                    url: "{{ tippen_pfad }}"
        - action: input_datetime.set_datetime
          target:
            entity_id: "{{ 'input_datetime.erinnerung_' ~ item.id ~ '_gemeldet' }}"
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
